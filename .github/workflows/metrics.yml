name: GitHub Metrics
on:
  # 毎日0時（UTC）に自動実行
  schedule:
    - cron: "0 0 * * *"
  # 手動実行も可能にする
  workflow_dispatch:
  # mainブランチへのpushでも実行
  push:
    branches:
      - main
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/output/metrics.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          base: ""
          plugin_followup: yes
          plugin_followup_indepth: yes
      - name: Half-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.plugin.isocalendar.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
      - name: Most used
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.plugin.languages.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
      - name: Icons
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.plugin.topics.icons.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
      - name: Compact display
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.plugin.achievements.compact.svg
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X